# ============================================================================
# 测试环境配置（由测试类上的 @ActiveProfiles("test") 激活）
#
# 测试要能在没有网络、没有中间件的机器上跑（比如 CI 或沙箱），
# 所以这里把所有外部依赖都换成内存/假实现，不连 Redis、Qdrant，也不调用真实模型。
# 测试只读 application.yml（公共配置）+ 本文件，不会读 application-local.yml。
# ============================================================================

spring:
  ai:
    model:
      # none=不装配 OpenAI 对话模型，改用 MockChatModel（只回显问题，不联网）
      chat: none
      embedding: openai
    openai:
      # 只为让 EmbeddingModel Bean 能正常创建；测试期间不会真的发起调用
      api-key: test-placeholder
    vectorstore:
      qdrant:
        # 不连 Qdrant、不建集合；服务会降级成"无知识库"模式
        initialize-schema: false

app:
  chat:
    provider: mock
  memory:
    # 会话与文档记录都放进程内，测试之间互不影响，也不需要 Redis
    type: memory
  knowledge:
    repository: memory
  storage:
    type: local
    local-path: ./target/test-data/knowledge
  rag:
    # 关闭向量检索，避免测试依赖 Qdrant 与 Embedding 服务
    enabled: false
    fail-fast: false
  apartment:
    # 不调用公寓系统接口
    enabled: false
  web:
    allowed-origins:
      - http://localhost:5173

management:
  health:
    redis:
      enabled: false
