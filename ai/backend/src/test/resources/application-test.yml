# ============================================================================
# 测试环境配置（由测试类上的 @ActiveProfiles("test") 激活）
#
# 测试要能在没有网络、没有中间件的机器上跑（CI、沙箱），所以：
#   - 数据库用 H2 内存库（MODE=MySQL 兼容 MySQL 语法），表结构见 src/test/resources/schema.sql
#   - 会话记忆用进程内实现（memory）
#   - 不连 Qdrant、不调真实模型，改用 MockChatModel
# 测试只读 application.yml（公共配置）+ 本文件，不会读 application-local.yml。
# ============================================================================

spring:
  datasource:
    # H2 内存库：进程结束即销毁，不依赖本机 MySQL
    url: jdbc:h2:mem:ai_customer_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    # H2 默认无密码
    password:
  sql:
    init:
      # 每次启动测试上下文都执行 schema.sql 建表
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    model:
      # none=不装配 OpenAI 对话模型，改用 MockChatModel（只回显问题，不联网）
      chat: none
      embedding: openai
    openai:
      # 只为让 EmbeddingModel Bean 能正常创建；测试期间不会真的发起调用
      api-key: test-placeholder
    vectorstore:
      qdrant:
        # 不连 Qdrant、不建集合；服务会降级成"无知识库"模式
        initialize-schema: false

app:
  chat:
    provider: mock
  memory:
    # 会话记忆放进程内，测试之间互不影响，也不需要 Redis
    type: memory
  storage:
    type: local
    local-path: ./target/test-data/knowledge
  rag:
    # 关闭向量检索，避免测试依赖 Qdrant 与 Embedding 服务
    enabled: false
    fail-fast: false
  apartment:
    # 不调用公寓系统接口
    enabled: false
  web:
    allowed-origins:
      - http://localhost:5173

management:
  health:
    redis:
      enabled: false
